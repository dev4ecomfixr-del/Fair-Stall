# Render deployment blueprint for Mela Fest Expo React Web Application
services:
  # Static Site Configuration (Fastest, Free & Optimized for Expo Web)
  - type: static
    name: mela-fest-fair-stall
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
